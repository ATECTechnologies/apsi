[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apsi"
version = "2.6.0"
description = "Apsi: a programming language for AI, physics and servers, compiled to native machine code — units, shapes, autodiff, low-precision formats, data pipelines and a hardened web server built in"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Apsi-License-2.0"
license-files = ["LICENSE"]
authors = [{name = "ATEC"}]
dependencies = ["numpy>=1.26", "llvmlite>=0.43; sys_platform != \"darwin\" or platform_machine != \"x86_64\"", "ml_dtypes>=0.5", "pyreadline3>=3.4; sys_platform == \"win32\""]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
torch = ["torch"]
web = ["uvloop; sys_platform != \"win32\""]

[project.scripts]
apsi = "apsi.cli:main"

[tool.setuptools]
packages = ["apsi", "apsi.native"]

[tool.setuptools.package-data]
apsi = ["MANIFEST.json"]
