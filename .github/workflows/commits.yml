# Measure several commits on one runner (Actions -> commits -> Run workflow), to find which change made what slower.
name: commits
on:
  workflow_dispatch:
    inputs:
      commits:
        description: "commits to compare, oldest first (space separated)"
        required: true
      rounds:
        description: "rounds"
        default: "3"
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONUTF8: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Install
        run: python -m pip install numpy llvmlite ml_dtypes
      - name: Measure
        run: python benchmarks/commits/measure.py --commits ${{ inputs.commits }} --rounds ${{ inputs.rounds }} --out out
      - name: Results
        if: always()
        run: |
          echo "=====BEGIN out/commits.json"; cat out/commits.json; echo; echo "=====END out/commits.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: commits-results, path: out }
