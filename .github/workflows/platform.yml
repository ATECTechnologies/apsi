# One platform: install, build the native example, run every test. Called by linux-x64.yml, linux-arm64.yml,
# windows-x64.yml, darwin-x64.yml and darwin-arm64.yml (one workflow each, so each has its own README badge).
name: platform
on:
  workflow_call:
    inputs:
      runner: { required: true, type: string }
      python: { required: false, type: string, default: "3.13" }
jobs:
  test:
    runs-on: ${{ inputs.runner }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ inputs.python }}" }
      - name: Install
        run: python -m pip install -e .
      - name: Build native example (Linux, macOS)
        if: runner.os != 'Windows'
        run: sh examples/native/build.sh
      - name: Build native example (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: examples\native\build.bat
      - name: Native compiler
        run: apsi native info
      - name: Language tests (compiler engine)
        run: apsi test examples tests/apsi --allow-all
      - name: Language tests (reference interpreter)
        run: apsi test examples tests/apsi --allow-all --engine interp
      - name: Toolchain tests
        run: python -m unittest discover tests
      - name: Formatting
        run: apsi fmt --check examples tests/apsi
