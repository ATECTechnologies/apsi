<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Apsi Setup</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; user-select: none; cursor: default; }
  body {
    -webkit-app-region: drag;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, "Ubuntu", "Cantarell", sans-serif;
    color: #cbd5e1; position: relative;
  }
  img { width: 210px; height: auto; margin-top: -6px; filter: drop-shadow(0 4px 18px rgba(20, 184, 166, .25)); }
  .msg { font-size: 15px; margin-top: 30px; letter-spacing: .01em; }
  .ver { font-size: 12px; color: #64748b; margin-top: 10px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(20, 184, 166, .18); overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; width: 38%; background: linear-gradient(90deg, transparent, #14b8a6 30%, #2dd4bf 70%, transparent); animation: run 1.25s ease-in-out infinite; }
  @keyframes run { from { left: -40%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; left: 0; width: 100%; } }
</style>
</head>
<body>
  <img src="../dist/wordmark.png" alt="apsi">
  <div class="msg">Preparing Apsi Setup…</div>
  <div class="ver" id="ver"></div>
  <div class="bar"><i></i></div>
<script>
  const v = new URLSearchParams(location.search).get("v");
  if (v) document.getElementById("ver").textContent = "Version " + v;
</script>
</body>
</html>
